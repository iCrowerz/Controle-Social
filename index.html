<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Painel CRAS · Rede Socioassistencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17241F;
    --ink-soft:#4C5D57;
    --bg:#F1F5F2;
    --card:#FFFFFF;
    --primary:#145C54;
    --primary-dark:#0C3F3A;
    --primary-tint:#E4EFEC;
    --accent:#DC9A2C;
    --accent-tint:#FBEED2;
    --line:#DCE5E0;
    --success:#3F8F5F;
    --danger:#B4483A;
    --radius:10px;
    --shadow: 0 1px 2px rgba(15,40,32,.06), 0 6px 20px -8px rgba(15,40,32,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    letter-spacing:.01em;
    text-transform:uppercase;
    color:var(--primary-dark);
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- Header ---------- */
  header.topbar{
    background:linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff;
    padding:14px 18px 16px;
    position:sticky; top:0; z-index:50;
    box-shadow:var(--shadow);
  }
  .topbar-row{display:flex; align-items:center; gap:12px; max-width:1180px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .brand-mark{
    width:38px; height:38px; border-radius:8px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:18px; color:var(--primary-dark);
    flex-shrink:0;
  }
  .brand-text .t1{font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:20px; line-height:1; letter-spacing:.02em; text-transform:uppercase;}
  .brand-text .t2{font-size:11px; opacity:.8; letter-spacing:.03em;}
  .search-wrap{flex:1 1 auto; position:relative;}
  .search-wrap input{
    width:100%; padding:10px 14px 10px 38px;
    border-radius:8px; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.12); color:#fff; font-size:15px;
    outline:none;
  }
  .search-wrap input::placeholder{color:rgba(255,255,255,.65);}
  .search-wrap input:focus{background:rgba(255,255,255,.2); border-color:var(--accent);}
  .search-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.75; font-size:15px;}

  .tabs{
    max-width:1180px; margin:12px auto 0; display:flex; gap:6px;
    overflow-x:auto; padding-bottom:2px; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    color:#fff; padding:7px 14px; border-radius:999px 999px 0 0;
    font-size:13px; font-weight:600; white-space:nowrap;
    border-bottom:none; position:relative; top:1px;
  }
  .tab-btn.active{ background:var(--bg); color:var(--primary-dark); border-color:var(--bg);}
  .tab-btn .count{opacity:.65; font-family:'IBM Plex Mono',monospace; font-size:11px; margin-left:5px;}
  .tab-btn.active .count{opacity:.5;}

  /* ---------- Layout ---------- */
  main{max-width:1180px; margin:0 auto; padding:20px 18px 60px;}
  .crumbs{font-size:13px; color:var(--ink-soft); margin-bottom:14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .crumbs button{background:none; border:none; color:var(--primary); font-weight:600; padding:0; font-size:13px;}
  .crumbs button:hover{text-decoration:underline;}

  /* ---------- Stat strip ---------- */
  .stat-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px;}
  .stat-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat-card .num{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; color:var(--primary-dark); line-height:1;}
  .stat-card .lbl{font-size:12px; color:var(--ink-soft); margin-top:4px; text-transform:uppercase; letter-spacing:.03em;}

  /* ---------- Section heading ---------- */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px;}
  .section-head h2{font-size:22px; margin:0;}
  .section-head .sub{font-size:12px; color:var(--ink-soft); text-transform:none; font-family:'Public Sans',sans-serif; font-weight:400;}

  /* ---------- CRAS grid (overview) ---------- */
  .cras-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .cras-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; text-align:left; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cras-card:before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--accent);
  }
  .cras-card:hover{transform:translateY(-2px); box-shadow:0 10px 26px -10px rgba(15,40,32,.3);}
  .cras-card .name{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; color:var(--primary-dark); text-transform:uppercase;}
  .cras-card .mini-row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft);}
  .bar-track{height:6px; background:var(--primary-tint); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:4px;}
  .cras-card .figures{display:flex; gap:16px;}
  .cras-card .figures div .n{font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:17px; color:var(--primary-dark);}
  .cras-card .figures div .l{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase;}

  /* ---------- Institution cards ---------- */
  .inst-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .inst-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; cursor:pointer; transition:border-color .12s ease, box-shadow .12s ease;
  }
  .inst-card:hover{border-color:var(--primary); box-shadow:var(--shadow);}
  .inst-card.active{border-color:var(--accent); background:var(--accent-tint);}
  .inst-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .inst-card .name{font-weight:700; font-size:14.5px; line-height:1.3;}
  .inst-card .badge{
    flex-shrink:0; background:var(--primary-tint); color:var(--primary-dark);
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:3px 8px; border-radius:999px;
  }
  .inst-card .meta{margin-top:8px; font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .inst-card .meta span{display:block;}

  /* ---------- Filters ---------- */
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .chip{
    border:1px solid var(--line); background:var(--card); border-radius:999px;
    padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .filter-input{
    border:1px solid var(--line); background:var(--card); border-radius:8px;
    padding:8px 12px; font-size:13.5px; min-width:150px; outline:none;
  }
  .filter-input:focus{border-color:var(--primary);}

  /* ---------- Beneficiary list ---------- */
  .bene-count{font-size:13px; color:var(--ink-soft); margin-bottom:10px;}
  .bene-list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--card);}
  .bene-row{
    display:grid; grid-template-columns:1fr auto auto auto; gap:12px; align-items:center;
    padding:10px 14px; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .bene-row:last-child{border-bottom:none;}
  .bene-row:nth-child(even){background:#FAFCFB;}
  .bene-row .nm{font-weight:600;}
  .bene-row .sub-inst{display:block; font-size:11.5px; color:var(--ink-soft); font-weight:400; margin-top:1px;}
  .sex-pill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; background:var(--primary-tint); color:var(--primary-dark);
  }
  .sex-pill.F{background:#F6E4EE; color:#9B3E72;}
  .sex-pill.M{background:#E4EEF6; color:#2E6F95;}
  .status-pill{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:#E5F3EA; color:var(--success);
    white-space:nowrap;
  }
  .date-txt{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty-state .big{font-family:'Barlow Condensed',sans-serif; font-size:26px; color:var(--primary-dark); text-transform:uppercase;}

  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color:var(--primary); font-weight:700; font-size:13px; padding:0; margin-bottom:4px;
  }

  footer{max-width:1180px; margin:10px auto 40px; padding:0 18px; font-size:11.5px; color:var(--ink-soft); text-align:center;}

  @media (max-width: 880px){
    .stat-strip{grid-template-columns:repeat(2,1fr);}
    .cras-grid{grid-template-columns:repeat(2,1fr);}
    .inst-grid{grid-template-columns:1fr;}
  }
  @media (max-width: 560px){
    .brand-text .t2{display:none;}
    .bene-row{grid-template-columns:1fr auto; grid-template-areas:"a b" "c c";}
    .bene-row .nm{grid-area:a;}
    .bene-row .sex-pill{grid-area:b;}
    .bene-row .date-txt, .bene-row .status-pill{grid-area:c;}
  }
</style>
<style>
  html.aguardando-autenticacao body {
    visibility: hidden;
  }
</style>

as": 8}, {"id": 1644, "nome": "MARIA DE LURDES JOAQUINA DOS SANTOS", "data_inclusao": "2024-02-29", "sexo": "F", "situacao": "Ativo", "id_ins": 68, "id_cras": 8}, {"id": 1645, "nome": "MARLENE DAS VERAS", "data_inclusao": "2024-02-20", "sexo": "F", "situacao": "Ativo", "id_ins": 68, "id_cras": 8}, {"id": 1646, "nome": "SONIA REGINA LOPES", "data_inclusao": "2024-03-04", "sexo": "F", "situacao": "Ativo", "id_ins": 68, "id_cras": 8}, {"id": 1647, "nome": "ZILMA DIAS XAVIER ZEFERINO", "data_inclusao": "2024-04-08", "sexo": "F", "situacao": "Ativo", "id_ins": 68, "id_cras": 8}], "dependentes": [{"id_depe": 1.0, "nome": "Aldalia Picanço Duarte", "idade": 36.0, "sexo": "F", "grau_parentesco": "Filha", "id_bene": 2.0}, {"id_depe": null, "nome": "Josely Picanço Duarte", "idade": 34.0, "sexo": "F", "grau_parentesco": "Filha", "id_bene": 2.0}, {"id_depe": null, "nome": "Jorge Anderson Picanço Duarte", "idade": 32.0, "sexo": "M", "grau_parentesco": "Filho", "id_bene": 2.0}, {"id_depe": null, "nome": "Jorge Luiz Limo Duarte", "idade": null, "sexo": null, "grau_parentesco": null, "id_bene": null}]}</script>
<script>
const DB = JSON.parse(document.getElementById('dados').textContent);
const crasById = Object.fromEntries(DB.cras.map(c => [c.id, c]));
const instById = Object.fromEntries(DB.instituicoes.map(i => [i.id, i]));

// pre-compute counts
DB.cras.forEach(c => {
  c.instituicoes = DB.instituicoes.filter(i => i.id_cras === c.id);
  c.beneficiarios = DB.beneficiarios.filter(b => b.id_cras === c.id);
});
DB.instituicoes.forEach(i => {
  i.beneficiarios = DB.beneficiarios.filter(b => b.id_ins === i.id);
});

let state = { view:'overview', crasId:null, instId:null, query:'' };

const app = document.getElementById('app');
const tabsEl = document.getElementById('tabs');
const globalSearch = document.getElementById('globalSearch');

function esc(s){
  return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(d){
  if(!d) return '—';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function renderTabs(){
  let html = `<button class="tab-btn ${state.view==='overview'?'active':''}" data-action="overview">Visão geral</button>`;
  DB.cras.forEach(c => {
    html += `<button class="tab-btn ${state.crasId===c.id?'active':''}" data-action="cras" data-id="${c.id}">${esc(c.nome.replace(/^Cras\s+/i,''))}<span class="count">${c.beneficiarios.length}</span></button>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.dataset.action === 'overview'){ goOverview(); }
      else { goCras(parseInt(btn.dataset.id)); }
    });
  });
}

function goOverview(){ state = {view:'overview', crasId:null, instId:null, query:''}; globalSearch.value=''; render(); }
function goCras(id){ state = {view:'cras', crasId:id, instId:null, query:''}; globalSearch.value=''; render(); }
function goInst(crasId, instId){ state = {view:'cras', crasId, instId, query:''}; render(); }
function goSearch(q){ state = {view:'search', crasId:null, instId:null, query:q}; render(); }

function beneRowsHTML(list, opts={}){
  if(list.length === 0){
    return `<div class="empty-state"><div class="big">Nada encontrado</div><div>Ajuste os filtros ou o termo de busca.</div></div>`;
  }
  return `<div class="bene-list">` + list.map(b => `
    <div class="bene-row">
      <div class="nm">${esc(b.nome)} ${opts.showInst && instById[b.id_ins] ? `<span class="sub-inst">${esc(instById[b.id_ins].nome)} · ${esc(crasById[b.id_cras].nome)}</span>` : ''}</div>
      <span class="sex-pill ${b.sexo==='F'||b.sexo==='M'?b.sexo:''}">${esc(b.sexo)}</span>
      <span class="status-pill">${esc(b.situacao)}</span>
      <span class="date-txt">${fmtDate(b.data_inclusao)}</span>
    </div>`).join('') + `</div>`;
}

function applyBeneFilters(list, filters){
  return list.filter(b => {
    if(filters.sexo && b.sexo !== filters.sexo) return false;
    if(filters.nome){
      const q = filters.nome.toLowerCase();
      if(!b.nome.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderOverview(){
  const totalInst = DB.instituicoes.length;
  const totalBene = DB.beneficiarios.length;
  const totalF = DB.beneficiarios.filter(b=>b.sexo==='F').length;
  const totalM = DB.beneficiarios.filter(b=>b.sexo==='M').length;
  const maxBene = Math.max(...DB.cras.map(c=>c.beneficiarios.length));

  app.innerHTML = `
    <div class="stat-strip">
      <div class="stat-card"><div class="num">${DB.cras.length}</div><div class="lbl">CRAS</div></div>
      <div class="stat-card"><div class="num">${totalInst}</div><div class="lbl">Instituições parceiras</div></div>
      <div class="stat-card"><div class="num">${totalBene.toLocaleString('pt-BR')}</div><div class="lbl">Beneficiários</div></div>
      <div class="stat-card"><div class="num">${totalF} <span style="font-size:14px;color:var(--ink-soft)">/ ${totalM}</span></div><div class="lbl">Mulheres / Homens</div></div>
    </div>

    <div class="section-head"><h2>CRAS</h2><span class="sub">toque em um CRAS para ver instituições e beneficiários</span></div>
    <div class="cras-grid">
      ${DB.cras.map(c => `
        <button class="cras-card" data-id="${c.id}">
          <div class="name">${esc(c.nome)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(c.beneficiarios.length/maxBene*100).toFixed(0)}%"></div></div>
          <div class="figures">
            <div><div class="n">${c.instituicoes.length}</div><div class="l">Instituições</div></div>
            <div><div class="n">${c.beneficiarios.length}</div><div class="l">Beneficiários</div></div>
          </div>
        </button>
      `).join('')}
    </div>
  `;
  app.querySelectorAll('.cras-card').forEach(el => el.addEventListener('click', () => goCras(parseInt(el.dataset.id))));
}

function renderCras(){
  const c = crasById[state.crasId];
  const inst = c.instituicoes.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
  const selectedInst = state.instId ? instById[state.instId] : null;
  const beneSource = selectedInst ? selectedInst.beneficiarios : c.beneficiarios;
  const filtered = applyBeneFilters(beneSource, { sexo: state.sexoFilter, nome: state.beneQuery });

  app.innerHTML = `
    <div class="crumbs"><button data-nav="overview">Visão geral</button> › <span>${esc(c.nome)}</span></div>

    <div class="stat-strip" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="num">${c.instituicoes.length}</div><div class="lbl">Instituições</div></div>
      <div class="stat-card"><div class="num">${c.beneficiarios.length}</div><div class="lbl">Beneficiários</div></div>
      <div class="stat-card"><div class="num">${c.beneficiarios.filter(b=>b.sexo==='F').length} / ${c.beneficiarios.filter(b=>b.sexo==='M').length}</div><div class="lbl">Mulheres / Homens</div></div>
    </div>

    <div class="section-head"><h2>Instituições</h2><span class="sub">${inst.length} organizações vinculadas a este CRAS</span></div>
    <div class="inst-grid">
      ${inst.map(i => `
        <div class="inst-card ${state.instId===i.id?'active':''}" data-id="${i.id}">
          <div class="top">
            <div class="name">${esc(i.nome)}</div>
            <div class="badge">${i.beneficiarios.length}</div>
          </div>
          <div class="meta">
            <span>👤 ${esc(i.responsavel||'—')}</span>
            <span>📍 ${esc(i.endereco||'—')}</span>
            <span>📞 ${esc(i.telefone||'—')} · nº entidade ${esc(i.numero)}</span>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="section-head"><h2>Beneficiários${selectedInst ? ' · ' + esc(selectedInst.nome) : ''}</h2>
      ${selectedInst ? `<span class="sub"><button class="back-btn" data-nav="clear-inst" style="display:inline">✕ limpar filtro de instituição</button></span>` : ''}
    </div>
    <div class="filter-row">
      <input class="filter-input" id="beneQuery" placeholder="Filtrar por nome…" value="${esc(state.beneQuery||'')}">
      <button class="chip ${state.sexoFilter==='F'?'active':''}" data-sexo="F">Mulheres</button>
      <button class="chip ${state.sexoFilter==='M'?'active':''}" data-sexo="M">Homens</button>
      <button class="chip ${!state.sexoFilter?'active':''}" data-sexo="">Todos</button>
    </div>
    <div class="bene-count">${filtered.length.toLocaleString('pt-BR')} beneficiário(s)</div>
    ${beneRowsHTML(filtered)}
  `;

  app.querySelector('[data-nav="overview"]').addEventListener('click', goOverview);
  const clearInstBtn = app.querySelector('[data-nav="clear-inst"]');
  if(clearInstBtn) clearInstBtn.addEventListener('click', () => { state.instId=null; render(); });

  app.querySelectorAll('.inst-card').forEach(el => el.addEventListener('click', () => {
    const id = parseInt(el.dataset.id);
    state.instId = state.instId === id ? null : id;
    render();
  }));

  app.querySelectorAll('.chip[data-sexo]').forEach(el => el.addEventListener('click', () => {
    state.sexoFilter = el.dataset.sexo || null;
    render();
  }));

  const bq = document.getElementById('beneQuery');
  bq.addEventListener('input', () => { state.beneQuery = bq.value; renderCrasListOnly(); });
  bq.focus();
  bq.selectionStart = bq.selectionEnd = bq.value.length;
}

// avoid full re-render (losing focus) on every keystroke in the beneficiary filter
function renderCrasListOnly(){
  const c = crasById[state.crasId];
  const selectedInst = state.instId ? instById[state.instId] : null;
  const beneSource = selectedInst ? selectedInst.beneficiarios : c.beneficiarios;
  const filtered = applyBeneFilters(beneSource, { sexo: state.sexoFilter, nome: state.beneQuery });
  document.querySelector('.bene-count').textContent = `${filtered.length.toLocaleString('pt-BR')} beneficiário(s)`;
  document.querySelector('.bene-list, .empty-state').outerHTML = beneRowsHTML(filtered);
}

function renderSearch(){
  const q = state.query.toLowerCase();
  const beneMatches = DB.beneficiarios.filter(b => b.nome.toLowerCase().includes(q));
  const instMatches = DB.instituicoes.filter(i => i.nome.toLowerCase().includes(q));

  app.innerHTML = `
    <div class="crumbs"><button data-nav="overview">Visão geral</button> › <span>Busca: "${esc(state.query)}"</span></div>

    ${instMatches.length ? `
      <div class="section-head"><h2>Instituições</h2><span class="sub">${instMatches.length} resultado(s)</span></div>
      <div class="inst-grid">
        ${instMatches.map(i => `
          <div class="inst-card" data-cras="${i.id_cras}" data-id="${i.id}">
            <div class="top"><div class="name">${esc(i.nome)}</div><div class="badge">${crasById[i.id_cras].nome.replace(/^Cras\s+/i,'')}</div></div>
            <div class="meta"><span>👤 ${esc(i.responsavel||'—')}</span><span>📍 ${esc(i.endereco||'—')}</span></div>
          </div>`).join('')}
      </div>` : ''
    }

    <div class="section-head"><h2>Beneficiários</h2><span class="sub">${beneMatches.length} resultado(s)</span></div>
    ${beneRowsHTML(beneMatches, {showInst:true})}
  `;
  app.querySelector('[data-nav="overview"]').addEventListener('click', goOverview);
  app.querySelectorAll('.inst-card').forEach(el => el.addEventListener('click', () => goInst(parseInt(el.dataset.cras), parseInt(el.dataset.id))));
}

function render(){
  renderTabs();
  if(state.view === 'overview') renderOverview();
  else if(state.view === 'cras') renderCras();
  else if(state.view === 'search') renderSearch();
  window.scrollTo({top:0, behavior:'instant'});
}

let searchTimer;
globalSearch.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const val = globalSearch.value.trim();
  searchTimer = setTimeout(() => {
    if(val.length >= 2) goSearch(val);
    else if(val.length === 0 && state.view === 'search') goOverview();
  }, 180);
});

render();
</script>
</body>
</html>
